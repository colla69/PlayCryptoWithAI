services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: playcryptowithais:latest
    container_name: playcrypto-bot
    restart: unless-stopped
    network_mode: host

    # ── Secrets & config ──────────────────────────────────────────────────────
    # Copy .env (your real keys) to the server alongside docker-compose.yml
    # It is NEVER committed to git.
    env_file: ./.env

    # ── Persistence ──────────────────────────────────────────────────────────
    # Bind mounts: data/ and logs/ live on the host, NOT in git — `.gitignore`
    # covers both (`data/*`, `logs/*`). A fresh host therefore starts empty and
    # rebuilds its own state rather than inheriting someone else's:
    #   candles  → `npm run download-history`, or just boot: initializeHistoricalData
    #              cold-starts and backfills config.historicalCandles bars per symbol
    #   equity / positions / trades / dashboard state → written at runtime
    # The candle caches were tracked until 2026-08-10. At ~350 MB that doubled the
    # git history every time a --repair rewrote them, to carry data the exchange
    # will always re-serve — and it kept the working tree permanently dirty.
    volumes:
      - ./data:/app/data     # candles, dashboard_persist.json, fearGreed, etc.
      - ./logs:/app/logs     # trades.csv (git-tracked), app.log (gitignored)

    # ── Logging ──────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

