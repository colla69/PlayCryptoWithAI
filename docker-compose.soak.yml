# TSM core sleeve — PAPER SOAK, designed to run ALONGSIDE the production bot
# on the same host: separate container, ports, data/ and logs/ mounts, so
# nothing collides with the live instance (which owns :3001 and ./data).
#
# The sleeve is paper-gated by design — in LIVE mode it logs a warning and
# no-ops — so the soak MUST run PAPER_MODE=true (enforced below).
#
#   docker compose -f docker-compose.soak.yml up -d --build
#   docker logs -f playcrypto-tsm-soak 2>&1 | grep TSM-CORE
#   Dashboard: http://<host>:3002
#
# First boot downloads its own candle cache into ./data-soak (a few minutes).
# Stop with: docker compose -f docker-compose.soak.yml down
services:
  tsm-soak:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: playcryptowithais:tsm-soak
    container_name: playcrypto-tsm-soak
    restart: unless-stopped
    network_mode: host

    env_file: ./.env
    environment:
      PAPER_MODE: "true"       # hard requirement — the sleeve no-ops in live mode
      TSM_CORE: "true"         # enable the TSM core sleeve (combo rule)
      SMOKE_TEST: "false"
      DASHBOARD_PORT: "3002"   # host networking — must differ from the live bot's 3001
      WEBHOOK_PORT: "3012"
      # TELEGRAM_TOKEN: ""     # uncomment to silence soak notifications

    volumes:
      - ./data-soak:/app/data  # own candles/persist/caches — never touches ./data
      - ./logs-soak:/app/logs

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
